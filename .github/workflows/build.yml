name: Build 8BallPool APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip 8BallPool project
      run: |
        # فك ضغط أي ملف ZIP موجود في المستودع تلقائياً
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Unzipping $f..."
            unzip -o "$f"
          fi
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build APK with Gradle
      run: |
        # البحث عن مجلد يحتوي على gradlew والتعرف عليه
        GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: 8BallPool-APK
        path: "**/outputs/apk/debug/*.apk"
        
