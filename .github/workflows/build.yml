name: Build 8BallPool APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip 8BallPool project
      run: |
        if [ -f "8BallPool-main.zip" ]; then
          echo "Unzipping 8BallPool-main.zip..."
          unzip -o 8BallPool-main.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: |
        # البحث عن ملف gradlew داخل المجلدات المفكوكة ومنحه صلاحية التنفيذ
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build APK with Gradle
      run: |
        # البحث عن مجلد المشروع الرئيسي الذي يحتوي على gradlew وبناء التطبيق
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "./8BallPool-main/gradlew" ]; then
          cd 8BallPool-main && ./gradlew assembleDebug
        else
          # محاولة البحث التلقائي
          BUILD_DIR=$(find . -name "gradlew" -maxdepth 3 | xargs dirname)
          if [ ! -z "$BUILD_DIR" ]; then
            cd "$BUILD_DIR" && ./gradlew assembleDebug
          else
            echo "Gradlew not found!"
            exit 1
          fi
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: 8BallPool-APK
        path: "**/outputs/apk/debug/*.apk"
        
